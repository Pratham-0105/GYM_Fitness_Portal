name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AryaFitness.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AryaFitness-APK
          path: AryaFitness.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-app
          name: "Arya Fitness Mobile App (Latest)"
          body: "Official Android APK for Arya Fitness Club. Download AryaFitness.apk below and install on your Android phone!"
          files: AryaFitness.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
