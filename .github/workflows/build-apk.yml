name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copy Web Assets to Android
        run: npx cap copy android || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle_output.txt

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk AryaFitness.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AryaFitness-APK
          path: AryaFitness.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: latest-app
          name: "Arya Fitness Mobile App (Latest)"
          body: "Official Android APK for Arya Fitness Club. Download AryaFitness.apk below and install directly on your Android phone!"
          files: AryaFitness.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Error Log if Build Fails
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure
          name: "Build Failure Diagnostics"
          body_path: gradle_output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
