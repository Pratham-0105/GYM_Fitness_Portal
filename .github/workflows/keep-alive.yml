name: Render 24-7 Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server to Prevent Sleep
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" https://arya-fitness-portal.onrender.com/
